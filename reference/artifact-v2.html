<title>프라 격납고</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style id="app-style">
/* Layout: hangar inventory — header + stat strip + filter rail + chamfered kit cards (cut corner = runner/panel line) */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --sunken:#E2E6EA; --line:#D2D8DF; --fg:#141B26; --muted:#5A6573;
  --accent:#F2B300; --accent-ink:#1C1500; --focus:#2D5BD3; --danger:#C2352F;
  --st-unbuilt:#4A5D7A; --st-building:#B26A00; --st-built:#1E7D45; --st-custom:#7A3FC4;
  --g-HG:#2D5BD3; --g-RG:#C2352F; --g-MG:#0F766E; --g-PG:#A16207; --g-EG:#64748B; --g-SD:#DB2777;
  --g-MGEX:#7C3AED; --g-MGSD:#BE185D; --g-RE100:#475569; --g-FM:#0369A1; --g-30MM:#4D7C0F; --g-etc:#6B7280;
  --f-display:"Chakra Petch","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --cut:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#1A2029; --sunken:#151A21; --line:#2B3440; --fg:#E6EAEF; --muted:#9AA5B1;
  --accent:#F5BC1A; --accent-ink:#1C1500; --focus:#7FA2FF; --danger:#F06A5F;
  --st-unbuilt:#93A9CC; --st-building:#F0A53A; --st-built:#4FC27F; --st-custom:#B48CF2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --sunken:#151A21; --line:#2B3440; --fg:#E6EAEF; --muted:#9AA5B1;
  --accent:#F5BC1A; --accent-ink:#1C1500; --focus:#7FA2FF; --danger:#F06A5F;
  --st-unbuilt:#93A9CC; --st-building:#F0A53A; --st-built:#4FC27F; --st-custom:#B48CF2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
@media (max-width:520px){.wrap{padding-inline:16px;padding-block:18px 48px}}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{margin:0 0 4px;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.16em;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.1;text-wrap:balance}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:6px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-family:var(--f-display);font-weight:700;letter-spacing:.02em;border-radius:0;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);padding-inline:18px}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:default}

/* stats */
.stats{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.02em}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.stat.hl .v{color:var(--st-unbuilt)}
@media (max-width:560px){.stat:last-child:nth-child(odd){grid-column:1/-1}}
.bar{background:var(--surface);padding:10px 16px 14px;display:flex;flex-direction:column;gap:8px}
.bar-track{display:flex;height:8px;background:var(--sunken);overflow:hidden}
.bar-track span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:0}

/* controls */
.controls{display:flex;flex-direction:column;gap:12px}
.ctl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 240px;min-width:0;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px}
.sel{padding:9px 10px;border:1px solid var(--line);background:var(--surface);border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;padding:5px 11px;border-radius:999px;cursor:pointer;font-size:13px;font-family:var(--f-display);font-weight:600;letter-spacing:.03em}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--f-mono);font-weight:400;opacity:.7;margin-left:4px;font-size:12px}
.count-line{font-size:13px;color:var(--muted)}

.banner{border:1px dashed var(--muted);padding:10px 14px;font-size:14px;color:var(--muted);background:var(--surface)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);min-width:0;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);transition:transform .15s ease}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--sunken);overflow:hidden;display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ghost{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.06em;color:var(--line);
  background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--line) 35%,transparent) 10px 11px);width:100%;height:100%;display:grid;place-items:center}
.grade{position:absolute;left:0;top:0;color:#fff;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:3px 9px 3px 8px;background:var(--g-etc)}
.meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.series{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta h3{margin:0;font-size:15px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .row{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.scale{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{--st:var(--st-unbuilt);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;color:var(--st);background:color-mix(in srgb,var(--st) 14%,transparent);white-space:nowrap}
.st-unbuilt{--st:var(--st-unbuilt)} .st-building{--st:var(--st-building)} .st-built{--st:var(--st-built)} .st-custom{--st:var(--st-custom)}
.sample-tag{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;padding:1px 7px;background:var(--fg);color:var(--bg)}
.empty{padding:48px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}

/* grade colors */
.g-HG{background:var(--g-HG)}.g-RG{background:var(--g-RG)}.g-MG{background:var(--g-MG)}.g-PG{background:var(--g-PG)}.g-EG{background:var(--g-EG)}
.g-SD{background:var(--g-SD)}.g-MGEX{background:var(--g-MGEX)}.g-MGSD{background:var(--g-MGSD)}.g-RE100{background:var(--g-RE100)}.g-FM{background:var(--g-FM)}.g-30MM{background:var(--g-30MM)}.g-etc{background:var(--g-etc)}

/* modal */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 55%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.panel{background:var(--surface);width:100%;max-width:600px;max-height:100%;overflow:auto;display:flex;flex-direction:column}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.panel-head h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700;overflow-wrap:anywhere;min-width:0}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;color:var(--muted)}
.x:focus-visible{outline:2px solid var(--focus)}
.panel-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.panel-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.panel-foot .r{display:flex;gap:8px;margin-left:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);background:var(--bg);border-radius:6px;width:100%;min-width:0}
.field textarea{min-height:80px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin:0}
.photo-edit{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-edit .thumb{width:120px;aspect-ratio:4/3;background:var(--sunken);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px}
.photo-edit .thumb img{width:100%;height:100%;object-fit:cover}
.detail-photo{aspect-ratio:4/3;max-width:100%;background:var(--sunken);overflow:hidden;position:relative}
.detail-photo img{width:100%;height:100%;object-fit:contain;display:block}
dl.specs{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
dl.specs dt{font-size:13px;color:var(--muted)}
dl.specs dd{margin:0;overflow-wrap:anywhere}
.memo{white-space:pre-wrap;background:var(--bg);padding:12px 14px;margin:0;font-size:14px;overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line)}
table.prev{border-collapse:collapse;width:100%;font-size:13px}
table.prev th,table.prev td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.prev th{background:var(--bg);font-weight:600;color:var(--muted)}
.meter{height:6px;background:var(--sunken)}
.meter span{display:block;height:100%;background:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.saving{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center;z-index:30;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em}
/* tabs, tags, selection, warnings */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.02em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-weight:400;font-size:13px;margin-left:6px}
.tab:focus-visible{outline:2px solid var(--focus)}
.chip-label{font-size:12px;color:var(--muted);align-self:center;margin-right:2px}
.chip.tag{font-family:var(--f-body);font-weight:500;letter-spacing:0}
.tagline{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.selected{outline:3px solid var(--accent);outline-offset:-3px}
.selbox{position:absolute;right:8px;top:8px;width:24px;height:24px;border:2px solid #fff;background:color-mix(in srgb,#000 35%,transparent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:14px;line-height:1}
.card.selected .selbox{background:var(--accent);border-color:var(--accent)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--fg);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.selbar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.selbar .btn.primary{background:var(--accent);color:var(--accent-ink)}
.selbar .cnt{font-weight:600;margin-right:6px}
.wrap.has-selbar{padding-bottom:140px}
.warn{border-left:3px solid var(--st-building);background:color-mix(in srgb,var(--st-building) 10%,transparent);padding:8px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg .chip{font-size:12px;padding:3px 9px;font-family:var(--f-body);font-weight:500;letter-spacing:0}
.form .sect{grid-column:1/-1;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:4px 0 -6px}
.form.is-wish .own-only{display:none}
.lbl-wish{display:none}.form.is-wish .lbl-wish{display:inline}.form.is-wish .lbl-own{display:none}
dd.missing{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
<div id="app"><div class="wrap"><p class="eyebrow">GUNPLA INVENTORY</p><h1>프라 격납고</h1><p class="count-line">목록을 불러오는 중이에요.</p></div></div>
<script type="application/json" id="kit-data">{"settings":{"name":"프라 격납고","hidePurchase":true},"kits":[]}</script>
<script id="app-script">
(function(){
'use strict';
var GRADES=['HG','RG','MG','PG','EG','SD','MGEX','MGSD','RE/100','FM','30MM','기타'];
var STATUSES=[{k:'unbuilt',l:'미개봉'},{k:'building',l:'조립 중'},{k:'built',l:'완성'},{k:'custom',l:'도색·개조'}];
var SCALES=['1/144','1/100','1/60','1/48','논스케일'];
var TAG_SUGGEST=['P-반다이','건담베이스 한정','이벤트 한정','클리어','코팅','재판'];
var STLABEL={};STATUSES.forEach(function(s){STLABEL[s.k]=s.l});
var FONT_LINK='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">';
var RESET_FALLBACK=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}';
var MAX_BYTES=16*1024*1024;

function normKit(k){
  k.list=k.list==='wish'?'wish':'own';
  k.tags=Array.isArray(k.tags)?k.tags.filter(Boolean):[];
  if(!(k.status in STLABEL))k.status='unbuilt';
  k.startDate=k.startDate||'';k.doneDate=k.doneDate||'';
  return k;
}
var data;
try{data=JSON.parse(document.getElementById('kit-data').textContent)}catch(e){data={}}
data.settings=Object.assign({name:'프라 격납고',hidePurchase:true},data.settings||{});
data.kits=(Array.isArray(data.kits)?data.kits:[]).map(normKit);
var SOURCE={style:document.getElementById('app-style').textContent,script:document.getElementById('app-script').textContent,
  reset:(function(){var s=document.head&&document.head.querySelector('style');return s&&s.textContent.trim()?s.textContent:RESET_FALLBACK})()};

var SAMPLE=[
 {id:'s1',name:'건담 에어리얼',grade:'HG',scale:'1/144',series:'기동전사 건담 수성의 마녀',brand:'반다이',status:'built',date:'2025-11-02',shop:'예시 매장',price:17000,tags:[],startDate:'2025-11-10',doneDate:'2025-11-16'},
 {id:'s2',name:'RX-78-2 건담 Ver.3.0',grade:'MG',scale:'1/100',series:'기동전사 건담',brand:'반다이',status:'unbuilt',date:'2026-03-15',shop:'',price:0,tags:['재판']},
 {id:'s3',name:'뉴건담',grade:'RG',scale:'1/144',series:'역습의 샤아',brand:'반다이',status:'building',date:'2026-07-20',shop:'예시 매장',price:45000,tags:[],startDate:'2026-09-28'},
 {id:'s4',name:'스트라이크 프리덤 건담',grade:'PG',scale:'1/60',series:'기동전사 건담 SEED DESTINY',brand:'반다이',status:'unbuilt',date:'2026-09-01',shop:'예시 매장',price:290000,tags:['P-반다이']},
 {id:'s5',list:'wish',name:'건담 캘리번',grade:'HG',scale:'1/144',series:'기동전사 건담 수성의 마녀',brand:'반다이',price:22000,tags:[]}
].map(function(k){k.sample=true;k.memo='';return normKit(k)});

var ui={q:'',grade:'all',status:'all',sort:'recent',tab:'own',tag:'all',gap:'all'};
try{var saved=JSON.parse(localStorage.getItem('plamo-ui')||'null');if(saved)ui=Object.assign(ui,saved,{q:''})}catch(e){}
function saveUI(){try{localStorage.setItem('plamo-ui',JSON.stringify({grade:ui.grade,status:ui.status,sort:ui.sort,tab:ui.tab,tag:ui.tag,gap:ui.gap}))}catch(e){}}

var canWrite=false,artNs=null,dlNs=null;
var sel=null; // Set of ids while selecting
var app=document.getElementById('app');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function gk(g){var k=String(g||'').replace(/[^A-Za-z0-9]/g,'');return GRADES.indexOf(g)>=0&&k?k:'etc'}
function gname(g){return GRADES.indexOf(g)>=0?g:'기타'}
function won(n){return (Number(n)||0).toLocaleString('ko-KR')+'원'}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function showPurchase(){return canWrite||!data.settings.hidePurchase}
function isSample(){return !data.kits.length}
function allKits(){return data.kits.length?data.kits:SAMPLE}
function tabKits(){return allKits().filter(function(k){return k.list===ui.tab})}
function uid(){return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function days(a,b){if(!a||!b)return null;var d=Math.round((new Date(b)-new Date(a))/864e5);return isNaN(d)||d<0?null:d+1}
function splitTags(s){var seen={};return String(s||'').split(/[,;|#]/).map(function(t){return t.trim()}).filter(function(t){if(!t||seen[t])return false;seen[t]=1;return true})}
function normName(s){return String(s||'').toLowerCase().replace(/^\s*(hguc|hgce|hg|rg|mgex|mgsd|mg|pg|eg|sd|re\/?100|fm|30mm)\b/,'').replace(/[\s\-_·.,()\[\]'"]/g,'')}
function findDups(name,grade,exceptId,pool){
  var n=normName(name);if(!n)return [];
  return (pool||data.kits).filter(function(k){return k.id!==exceptId&&normName(k.name)===n&&gname(k.grade)===gname(grade)});
}
var GAPS={
  purchase:{l:'구매 정보 빈 칸',t:function(k){return k.list==='own'&&(!k.date||!k.shop||!k.price)}},
  photo:{l:'사진 없음',t:function(k){return !k.photo}},
  series:{l:'시리즈 빈 칸',t:function(k){return !k.series}},

/* ---------- document regeneration ---------- */
function buildDoc(d){
  var json=JSON.stringify(d).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+SOURCE.reset+'</style></head><body>'+
    '<title>'+esc(d.settings.name||'프라 격납고')+'</title>\n'+FONT_LINK+'\n<style id="app-style">'+SOURCE.style+'</style>\n'+
    '<div id="app"><div class="wrap"><p class="eyebrow">GUNPLA INVENTORY</p><h1>'+esc(d.settings.name)+'</h1><p class="count-line">목록을 불러오는 중이에요.</p></div></div>\n'+
    '<script type="application/json" id="kit-data">'+json+'<\/script>\n<script id="app-script">'+SOURCE.script+'<\/script></body></html>';
}
function docBytes(d){return new Blob([buildDoc(d)]).size}

var busy=false;
function commit(mutate,okMsg){
  if(busy)return Promise.resolve(false);
  if(!artNs||!canWrite){toast('이 화면에서는 저장할 수 없어요.');return Promise.resolve(false)}
  var next=JSON.parse(JSON.stringify(data));mutate(next);
  var html=buildDoc(next);var size=new Blob([html]).size;
  if(size>MAX_BYTES-200*1024){toast('페이지 용량(16MB) 한도를 넘어요. 사진이 있는 항목을 몇 개 정리해 주세요.');return Promise.resolve(false)}
  busy=true;setSaving(true);
  try{sessionStorage.setItem('plamo-toast',okMsg)}catch(e){}
  var attempt=function(retry){
    return artNs.publish(html).then(function(){data=next;return true},function(err){
      var c=err&&err.code;
      if(c==='upstream_error'&&retry){return new Promise(function(r){setTimeout(r,800+Math.random()*800)}).then(function(){return attempt(false)})}
      try{sessionStorage.removeItem('plamo-toast')}catch(e){}
      busy=false;setSaving(false);
      if(c==='conflict'){toast('다른 곳에서 먼저 저장된 버전이 있어 새로 불러와요. 한 번 더 저장해 주세요.')}
      else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){canWrite=false;sel=null;renderAll();toast('보기 전용 화면이라 저장할 수 없어요.')}
      else if(c==='too_large'){toast('페이지 용량 한도를 넘어 저장하지 못했어요. 사진을 줄여 주세요.')}
      else if(c==='rate_limited'){toast('저장을 너무 자주 했어요. 잠시 후 다시 저장해 주세요.')}
      else{toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요.')}
      return false;
    });
  };
  return attempt(true);
}

function filtered(){
  var q=ui.q.trim().toLowerCase();
  var list=tabKits().filter(function(k){
    if(ui.grade!=='all'&&gname(k.grade)!==ui.grade)return false;
    if(ui.tab==='own'&&ui.status!=='all'&&k.status!==ui.status)return false;
    if(ui.tag!=='all'&&k.tags.indexOf(ui.tag)<0)return false;
    if(ui.gap!=='all'&&GAPS[ui.gap]&&!GAPS[ui.gap].t(k))return false;
    if(q&&[k.name,k.series,k.memo,k.grade,k.brand,k.shop,k.tags.join(' ')].join(' ').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var gi=function(g){var i=GRADES.indexOf(g);return i<0?99:i};
  var byName=function(a,b){return String(a.name).localeCompare(String(b.name),'ko')};
  list.sort(function(a,b){
    if(ui.sort==='name')return byName(a,b);
    if(ui.sort==='grade')return gi(a.grade)-gi(b.grade)||byName(a,b);
    if(ui.sort==='price')return (Number(b.price)||0)-(Number(a.price)||0);
    if(ui.sort==='done')return String(b.doneDate||'').localeCompare(String(a.doneDate||''))||byName(a,b);
    if(ui.tab==='wish')return String(b.created||'').localeCompare(String(a.created||''));
    return String(b.date||'').localeCompare(String(a.date||''))||String(b.created||'').localeCompare(String(a.created||''));
  });
  return list;
}

function shrink(file){
  return new Promise(function(res,rej){
    var r=new FileReader();r.onerror=rej;
    r.onload=function(){var img=new Image();img.onerror=rej;img.onload=function(){
      var max=640,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
      var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
      var q=.78,url=c.toDataURL('image/jpeg',q);
      while(url.length>90000&&q>.4){q-=.08;url=c.toDataURL('image/jpeg',q)}
      res(url);
    };img.src=r.result};
    r.readAsDataURL(file);
  });
}

function parseDelimited(text){
  var delim=text.indexOf('\t')>=0?'\t':',';var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch;continue}
    if(ch==='"'&&cur===''){q=true;continue}
    if(ch===delim){row.push(cur);cur='';continue}
    if(ch==='\r')continue;
    if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';continue}
    cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(function(r){return r.some(function(c){return String(c).trim()})});
}
function normGrade(g,name){
  var s=String(g||'').toUpperCase().replace(/\s/g,'');
  var order=['MGEX','MGSD','RE/100','RE100','30MM','HG','RG','MG','PG','EG','SD','FM','BB'];
  var hit=function(str){for(var i=0;i<order.length;i++){if(str.indexOf(order[i])>=0){var o=order[i];return o==='RE100'?'RE/100':o==='BB'?'SD':o}}return ''};
  return (s&&hit(s))||hit(String(name||'').toUpperCase())||'기타';
}
function normStatus(s){s=String(s||'').replace(/\s/g,'');
  if(/도색|개조|커스텀|먹선/.test(s))return 'custom';
  if(/조립중|진행|작업중|가조립중/.test(s))return 'building';
  if(/완성|완료|조립완|가조립/.test(s))return 'built';
  return 'unbuilt';}
function normScale(s,grade){s=String(s||'').replace(/\s/g,'');var m=s.match(/1\/(\d+)/);if(m)return '1/'+m[1];
  if(/논|non|없/i.test(s))return '논스케일';
  return {HG:'1/144',RG:'1/144',EG:'1/144',MG:'1/100',PG:'1/60','RE/100':'1/100',FM:'1/100',MGEX:'1/100',SD:'논스케일',MGSD:'논스케일'}[grade]||'논스케일';}
function normDate(s){s=String(s||'').trim();if(!s)return '';
  var m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m){var y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2)}
  if(/^\d{5}$/.test(s)){var d=new Date(Math.round((Number(s)-25569)*864e5));return d.toISOString().slice(0,10)}
  return '';}
function rowsToKits(rows){
  if(!rows.length)return {kits:[],skipped:0};
  var map=null,start=0;
  for(var r=0;r<Math.min(rows.length,5)&&!map;r++){
    var m={},found=0;
    rows[r].forEach(function(cell,i){var c=String(cell).trim().toLowerCase();if(!c)return;
      var keys=Object.keys(ALIASES);
      var exact=keys.filter(function(key){return m[key]==null&&ALIASES[key].some(function(a){return c===a.toLowerCase()})})[0];
      var key=exact||keys.filter(function(key){return m[key]==null&&ALIASES[key].some(function(a){return c.indexOf(a.toLowerCase())===0})})[0];
      if(key){m[key]=i;found++}});
    if(found>=2&&m.name!=null){map=m;start=r+1}
  }
  if(!map){map={};DEFAULT_ORDER.forEach(function(k,i){map[k]=i});start=0}
  var out=[],skipped=0,now=Date.now();
  rows.slice(start).forEach(function(row,i){
    var get=function(k){return map[k]==null?'':String(row[map[k]]==null?'':row[map[k]]).trim()};
    var name=get('name');if(!name){skipped++;return}
    var grade=normGrade(get('grade'),name),wish=/위시|wish|희망/i.test(get('list'));
    out.push({id:uid()+i,created:new Date(now+i).toISOString(),list:wish?'wish':'own',name:name,grade:grade,scale:normScale(get('scale'),grade),series:get('series'),brand:get('brand')||'반다이',
      status:wish?'unbuilt':normStatus(get('status')),date:wish?'':normDate(get('date')),shop:wish?'':get('shop'),price:Number(get('price').replace(/[^0-9]/g,''))||0,
      tags:splitTags(get('tags')),startDate:normDate(get('startDate')),doneDate:normDate(get('doneDate')),memo:get('memo'),photo:''});
  });
  return {kits:out,skipped:skipped};
}

function openImport(){
  var parsed=null,dups=[];
  var body='<p class="hint" style="font-size:14px">엑셀 파일(.xlsx)이나 CSV를 고르거나, 엑셀에서 표를 복사해 아래 칸에 붙여넣어 주세요. 첫 줄에 <b>이름, 등급, 스케일, 시리즈, 상태, 구매일, 구매처, 가격, 태그, 메모</b> 같은 제목이 있으면 자동으로 맞춰요. "엑셀 백업"으로 받은 파일도 그대로 가져올 수 있어요.</p>'+
   '<div class="field"><label for="i-file">파일</label><input id="i-file" type="file" accept=".xlsx,.xls,.csv,.tsv,.txt"></div>'+
   '<div class="field"><label for="i-text">붙여넣기</label><textarea id="i-text" placeholder="이름&#9;등급&#9;상태&#10;건담 에어리얼&#9;HG&#9;완성"></textarea></div>'+
   '<div id="i-prev"></div>';
  var foot='<div class="r"><button class="btn" data-close>취소</button><button class="btn primary" id="i-go" disabled>가져오기</button></div>';
  var m=openModal('엑셀·CSV 가져오기',body,foot);
  var prev=m.querySelector('#i-prev'),go=m.querySelector('#i-go'),ta=m.querySelector('#i-text');
  var count=function(){var skip=m.querySelector('#i-skip');var n=parsed.kits.length-(skip&&skip.checked?dups.length:0);go.disabled=!n;go.textContent=n+'개 가져오기'};
  var show=function(rows){
    parsed=rowsToKits(rows);
    if(!parsed.kits.length){prev.innerHTML='<p class="hint">이름이 있는 행을 찾지 못했어요. 첫 줄 제목에 "이름"이 있는지 확인해 주세요.</p>';go.disabled=true;go.textContent='가져오기';return}
    var seen=data.kits.slice();dups=[];
    parsed.kits.forEach(function(k){if(findDups(k.name,k.grade,null,seen).length)dups.push(k.id);seen.push(k)});
    prev.innerHTML='<p class="hint">'+parsed.kits.length+'개를 찾았어요'+(parsed.skipped?' (이름 없는 '+parsed.skipped+'행 제외)':'')+'. 앞의 8개 미리보기:</p>'+
     '<div class="tbl-wrap"><table class="prev"><thead><tr><th>목록</th><th>이름</th><th>등급</th><th>스케일</th><th>상태</th><th>구매일</th><th>가격</th><th>태그</th></tr></thead><tbody>'+
     parsed.kits.slice(0,8).map(function(k){return '<tr><td>'+(k.list==='wish'?'위시':'보유')+'</td><td>'+esc(k.name)+(dups.indexOf(k.id)>=0?' <b>(중복)</b>':'')+'</td><td>'+esc(k.grade)+'</td><td>'+esc(k.scale)+'</td><td>'+(k.list==='wish'?'':STLABEL[k.status])+'</td><td class="mono">'+esc(k.date)+'</td><td class="mono">'+(k.price?won(k.price):'')+'</td><td>'+esc(k.tags.join(', '))+'</td></tr>'}).join('')+
     '</tbody></table></div>'+
     (dups.length?'<label class="check"><input type="checkbox" id="i-skip" checked><span>이미 있는 것과 겹치는 '+dups.length+'개는 건너뛰기</span></label>':'');
    var sk=m.querySelector('#i-skip');if(sk)sk.addEventListener('change',count);
    count();
  };
  ta.addEventListener('input',function(){if(ta.value.trim())show(parseDelimited(ta.value));else{prev.innerHTML='';go.disabled=true}});
  m.querySelector('#i-file').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;prev.innerHTML='<p class="hint">읽는 중…</p>';
    if(/\.(xlsx|xls)$/i.test(f.name)){
      Promise.all([loadXLSX(),f.arrayBuffer()]).then(function(r){
        var wb=r[0].read(r[1],{type:'array',cellDates:true});var ws=wb.Sheets[wb.SheetNames[0]];
        show(r[0].utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'yyyy-mm-dd',defval:''}));
      }).catch(function(){prev.innerHTML='<p class="hint">엑셀 파일을 읽지 못했어요. 엑셀에서 표를 복사해 붙여넣거나 CSV로 저장해서 올려 주세요.</p>'});
    }else{
      f.text().then(function(t){show(parseDelimited(t))});
    }
  });
  go.addEventListener('click',function(){
    if(!parsed||!parsed.kits.length)return;var sk=m.querySelector('#i-skip'),skip=sk&&sk.checked;
    var add=parsed.kits.filter(function(k){return !(skip&&dups.indexOf(k.id)>=0)});if(!add.length)return;
    commit(function(d){d.kits=d.kits.concat(add)},add.length+'개를 가져왔어요.');
  });
}

/* ---------- boot ---------- */
renderAll();
try{var pend=sessionStorage.getItem('plamo-toast');if(pend){sessionStorage.removeItem('plamo-toast');toast(pend)}}catch(e){}
if(window.claude&&typeof window.claude.use==='function'){
  var use=function(n){return window.claude.use(n).catch(function(){return null})};
  Promise.all([use('artifact'),use('user'),use('downloads')]).then(function(r){
    artNs=r[0];var user=r[1];dlNs=r[2];
    if(!artNs)return;
    return (user?user.canEdit():Promise.resolve(true)).then(function(ok){if(ok){canWrite=true;renderAll()}});
  });
}
})();
</script>
