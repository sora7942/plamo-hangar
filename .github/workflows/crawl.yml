name: crawl

# 매일 KST 07:10(= UTC 22:10 전날)에 반다이 호비사이트·조이하비를 수집해 docs/data의 카탈로그·피드·kr-arrivals·series-ko·meta를 커밋한다.
# 수동 실행(workflow_dispatch)으로 최초 채우기(bootstrap)를 여러 번 돌릴 수 있고, 조이하비 과거 글만 채우는 실행(joy_backfill)도 있다.
# collection.json·photos는 절대 건드리지 않는다 (아래 커밋 단계의 허용 목록 검사).
# Actions cron은 UTC 기준이고 몇 분씩 늦게 돌며, 부하가 크면 건너뛰기도 한다.
on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "최초 채우기 (일정을 2015-01까지 거슬러 올라가고 걸프라 브랜드를 전체 쪽수로 수집)"
        type: boolean
        default: false
      max_backlog:
        description: "실행당 상세 '밀린 상품' 상한 (기본 150, 어떤 값이든 합계는 400을 넘지 않는다)"
        type: number
        default: 150
      joy_backfill:
        description: "조이하비 과거 글 채우기만 실행 (--bootstrap --only joyhobby). 호비사이트는 건드리지 않고, 진행 위치는 meta.crawl.joyNext. 알림 없음"
        type: boolean
        default: false
      brand_backfill:
        description: "2015년 이전 상품 채우기 (HG·HGUC·MG·RG·MGSD·SD 계열 브랜드 목록 약 366쪽을 카드만으로 훑는다, 약 8분, 알림 없음). 다른 수집은 하지 않고 커서(meta.crawl.brandBackfill)로 이어 한다"
        type: boolean
        default: false
      discord_test:
        description: "디스코드 테스트 알림 1건만 보낸다 (수집·커밋 없음). feed.json 최근 3개(내 프라 연결 항목 포함)를 실제 알림과 같은 형식으로, 맨 앞에 [테스트] 표시"
        type: boolean
        default: false
      joy_pages:
        description: "조이하비 과거 목록을 훑을 쪽 수 (기본 25 — 게시판이 20쪽이라 한 번에 끝난다). bootstrap과 같이 켜도 적용"
        type: number
        default: 25

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 얕은 클론에서는 pull --rebase가 실패할 수 있어 전체 이력을 받는다 (저장소가 작다)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Crawl
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          MAX_BACKLOG: ${{ inputs.max_backlog }}
          JOY_BACKFILL: ${{ inputs.joy_backfill }}
          JOY_PAGES: ${{ inputs.joy_pages }}
          DISCORD_TEST: ${{ inputs.discord_test }}
          BRAND_BACKFILL: ${{ inputs.brand_backfill }}
        run: |
          if [ "$DISCORD_TEST" = "true" ]; then
            python main.py --discord-test          # 수집·파일 쓰기 없음
            exit 0
          fi
          if [ "$BRAND_BACKFILL" = "true" ]; then
            python main.py --brand-backfill        # 목록 카드만 (상세·번역은 매일 실행이 나눠서 채운다)
            exit 0
          fi
          args=()
          if [ "$BOOTSTRAP" = "true" ]; then
            args+=(--bootstrap)
          elif [ "$JOY_BACKFILL" = "true" ]; then
            args+=(--bootstrap --only joyhobby)
          fi
          if [ -n "$MAX_BACKLOG" ]; then args+=(--max-backlog "$MAX_BACKLOG"); fi
          if [ -n "$JOY_PAGES" ]; then args+=(--joy-pages "$JOY_PAGES"); fi
          python main.py "${args[@]}"

      # 요청 간격·횟수 확인용 (7일 보관). 로그에는 웹훅·키가 들어가지 않는다.
      - name: Upload request log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-requests-log
          path: crawler/out/requests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit data
        if: ${{ !inputs.discord_test }}          # 테스트 알림 실행은 데이터를 바꾸지 않으므로 커밋 단계도 건너뛴다
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 사이트(소유자 저장)가 같은 브랜치에 커밋했을 수 있어 먼저 최신을 받아 둔다. 수집 결과는 autostash로 보존.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

          for f in catalog-gunpla catalog-girl catalog-pending feed meta kr-arrivals series-ko; do
            if [ -f "docs/data/$f.json" ]; then git add -- "docs/data/$f.json"; fi
          done

          # 허용 목록 밖의 경로(collection.json, photos/ 등)가 올라가면 중단한다
          bad=$(git diff --cached --name-only | grep -v -E '^docs/data/(catalog-gunpla|catalog-girl|catalog-pending|feed|meta|kr-arrivals|series-ko)\.json$' || true)
          if [ -n "$bad" ]; then
            echo "::error::허용 목록 밖의 변경이 staged 되었습니다: $bad"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다"
            exit 0
          fi

          git commit -m "data: crawl $(TZ=Asia/Seoul date +%F)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push 실패($attempt/3) — 최신을 받아 다시 시도합니다"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::push에 3번 실패했습니다"
          exit 1
