name: spike

# 0단계 검증: 로컬과 같은 스크립트를 GitHub Actions(해외 IP)에서 돌려 접속 가능 여부를 본다.
# 수동 실행(workflow_dispatch)만. 결과는 artifact(spike-actions-results)로 올라온다.
# 원본 HTML 캐시와 (공식 이미지가 찍힌) 스크린샷은 artifact에서 제외한다. 이미지 로드 결과는 hotlink-summary.json에 있다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike
  cancel-in-progress: false

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spike/requirements.txt

      - run: pip install -r spike/requirements.txt

      - run: python -m playwright install --with-deps chromium

      # 상세 페이지 합계 30개 이하, 요청 간격 1.2초 이상 (spike/common.py). 실패해도 artifact는 올린다.
      - name: Run spike
        run: python spike/run_all.py --env actions --out spike/out-actions

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-actions-results
          path: |
            spike/out-actions/
            !spike/out-actions/cache/
            !spike/out-actions/screenshots/
          if-no-files-found: warn
          retention-days: 14
